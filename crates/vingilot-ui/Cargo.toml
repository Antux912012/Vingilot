[package]
name = "vingilot-ui"
version = "0.1.2-b"
edition = "2021"

[dependencies]
vingilot-core = { path = "../vingilot-core" }
vingilot-engine = { path = "../vingilot-engine" }
vingilot-ai = { path = "../vingilot-ai" }
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "vingilot-ui"
path = "src/main.rs"
