[package]
name = "vingilot-downloadd"
version = "0.1.6"
edition = "2021"
description = "Standalone background download daemon (HTTP multi-part + Torrent/Magnet + Tray IPC) for Vingilot ecosystem"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
url = "2.5"
vingilot-common = { path = "../vingilot-common" }
vingilot-core = { path = "../vingilot-core" }

[dev-dependencies]
tempfile = "3.13"
