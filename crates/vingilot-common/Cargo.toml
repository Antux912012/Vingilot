[package]
name = "vingilot-common"
version = "0.1.6"
edition = "2021"
description = "Shared common primitives (Cookie parsing, SQLite hardening, Tray and IPC models) for Vingilot & YT Extractor ecosystems"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.13"
