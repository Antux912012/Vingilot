app-id: io.github.antux912012.Vingilot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vingilot-ui

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vingilot/cargo

finish-args:
  # Wayland and X11 access
  - --socket=fallback-x11
  - --socket=wayland
  # IPC sharing for shared memory (Wayland/X11 SHM, WebKit IPC, Vulkan)
  - --share=ipc
  # Audio playback
  - --socket=pulseaudio
  # Network access for web browsing
  - --share=network
  # GPU acceleration and input devices
  - --device=dri
  - --device=input
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # File access for downloads
  - --filesystem=xdg-download

modules:
  - name: vingilot
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --bin vingilot-ui --bin vingilot-cli
      - install -Dm755 target/release/vingilot-ui /app/bin/vingilot-ui
      - install -Dm755 target/release/vingilot-cli /app/bin/vingilot-cli
      - install -Dm644 data/io.github.antux912012.Vingilot.desktop /app/share/applications/io.github.antux912012.Vingilot.desktop
      - install -Dm644 data/io.github.antux912012.Vingilot.metainfo.xml /app/share/metainfo/io.github.antux912012.Vingilot.metainfo.xml
      - install -Dm644 data/icons/hicolor/16x16/apps/io.github.antux912012.Vingilot.png /app/share/icons/hicolor/16x16/apps/io.github.antux912012.Vingilot.png
      - install -Dm644 data/icons/hicolor/32x32/apps/io.github.antux912012.Vingilot.png /app/share/icons/hicolor/32x32/apps/io.github.antux912012.Vingilot.png
      - install -Dm644 data/icons/hicolor/48x48/apps/io.github.antux912012.Vingilot.png /app/share/icons/hicolor/48x48/apps/io.github.antux912012.Vingilot.png
      - install -Dm644 data/icons/hicolor/64x64/apps/io.github.antux912012.Vingilot.png /app/share/icons/hicolor/64x64/apps/io.github.antux912012.Vingilot.png
      - install -Dm644 data/icons/hicolor/128x128/apps/io.github.antux912012.Vingilot.png /app/share/icons/hicolor/128x128/apps/io.github.antux912012.Vingilot.png
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.antux912012.Vingilot.png /app/share/icons/hicolor/256x256/apps/io.github.antux912012.Vingilot.png
      - install -Dm644 data/icons/hicolor/512x512/apps/io.github.antux912012.Vingilot.png /app/share/icons/hicolor/512x512/apps/io.github.antux912012.Vingilot.png
      - install -Dm644 data/icons/io.github.antux912012.Vingilot.svg /app/share/icons/hicolor/scalable/apps/io.github.antux912012.Vingilot.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.antux912012.Vingilot-symbolic.svg /app/share/icons/hicolor/symbolic/apps/io.github.antux912012.Vingilot-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/vingilot-hamburger-symbolic.svg /app/share/icons/hicolor/symbolic/apps/vingilot-hamburger-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/vingilot-incognito-symbolic.svg /app/share/icons/hicolor/symbolic/apps/vingilot-incognito-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/vingilot-search-ddg-symbolic.svg /app/share/icons/hicolor/symbolic/apps/vingilot-search-ddg-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/vingilot-search-google-symbolic.svg /app/share/icons/hicolor/symbolic/apps/vingilot-search-google-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/vingilot-search-brave-symbolic.svg /app/share/icons/hicolor/symbolic/apps/vingilot-search-brave-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/vingilot-search-bing-symbolic.svg /app/share/icons/hicolor/symbolic/apps/vingilot-search-bing-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/vingilot-search-ecosia-symbolic.svg /app/share/icons/hicolor/symbolic/apps/vingilot-search-ecosia-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/search-engine-duckduckgo.svg /app/share/icons/hicolor/symbolic/apps/search-engine-duckduckgo.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/search-engine-google.svg /app/share/icons/hicolor/symbolic/apps/search-engine-google.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/search-engine-brave.svg /app/share/icons/hicolor/symbolic/apps/search-engine-brave.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/search-engine-bing.svg /app/share/icons/hicolor/symbolic/apps/search-engine-bing.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/search-engine-ecosia.svg /app/share/icons/hicolor/symbolic/apps/search-engine-ecosia.svg
    sources:
      - type: dir
        path: ..
