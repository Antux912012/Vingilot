app-id: io.github.vingilot.Vingilot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vingilot-ui

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vingilot/cargo

finish-args:
  # Wayland and X11 access
  - --socket=fallback-x11
  - --socket=wayland
  # Audio playback
  - --socket=pulseaudio
  # Network access for web browsing
  - --share=network
  # GPU acceleration
  - --device=dri
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # File access for downloads
  - --filesystem=xdg-download

modules:
  - name: vingilot
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --bin vingilot-ui --bin vingilot-cli
      - install -Dm755 target/release/vingilot-ui /app/bin/vingilot-ui
      - install -Dm755 target/release/vingilot-cli /app/bin/vingilot-cli
      - install -Dm644 data/io.github.vingilot.Vingilot.desktop /app/share/applications/io.github.vingilot.Vingilot.desktop
      - install -Dm644 data/io.github.vingilot.Vingilot.metainfo.xml /app/share/metainfo/io.github.vingilot.Vingilot.metainfo.xml
      - install -Dm644 data/io.github.vingilot.Vingilot.svg /app/share/icons/hicolor/scalable/apps/io.github.vingilot.Vingilot.svg
      - install -Dm644 data/io.github.vingilot.Vingilot.svg /app/share/icons/hicolor/128x128/apps/io.github.vingilot.Vingilot.svg
    sources:
      - type: dir
        path: ..
