<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Monochromatic symbolic version for toolbars, menus, and compact UI -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star at top: center (8, 4.5), points (8, 1), (8, 8), (5, 4.5), (11, 4.5) -->
    <path d="M 8 1 Q 8 4.5 11 4.5 Q 8 4.5 8 8 Q 8 4.5 5 4.5 Q 8 4.5 8 1 Z" fill="currentColor" stroke="none"/>
    
    <!-- Hull outline: apex (8, 9.5), sides (13, 11), bottom corners (12, 14.5), (4, 14.5), (3, 11) -->
    <polygon points="8,9.5 13,11 12,14.5 4,14.5 3,11" stroke-width="1.1"/>
    <!-- Center divider / keel -->
    <line x1="8" y1="9.5" x2="8" y2="14.5" stroke-width="1.1"/>
  </g>
</svg>
